spring.application.name=api-gateway
server.port=8088

# Enable service discovery routes
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

#eureka.instance.ip-address=127.0.0.1
#eureka.instance.hostname=127.0.0.1


# Force fresh registry fetch
eureka.client.registry-fetch-interval-seconds=5

# Redis config
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=6379



# User Service Circuit Breaker
resilience4j.circuitbreaker.instances.userService.sliding-window-size=10
resilience4j.circuitbreaker.instances.userService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.userService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.userService.permitted-number-of-calls-in-half-open-state=3

# Question Service Circuit Breaker
resilience4j.circuitbreaker.instances.questionService.sliding-window-size=10
resilience4j.circuitbreaker.instances.questionService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.questionService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.questionService.permitted-number-of-calls-in-half-open-state=3

# Quiz Service Circuit Breaker
resilience4j.circuitbreaker.instances.quizService.sliding-window-size=10
resilience4j.circuitbreaker.instances.quizService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.quizService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.quizService.permitted-number-of-calls-in-half-open-state=3

