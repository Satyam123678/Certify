<div class="min-h-screen bg-gray-950 flex items-center justify-center px-4">

  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-0 right-1/4 w-96 h-96 bg-indigo-600 opacity-10 rounded-full blur-3xl"></div>
    <div class="absolute bottom-0 left-1/4 w-96 h-96 bg-violet-600 opacity-10 rounded-full blur-3xl"></div>
  </div>

  <div class="relative w-full max-w-md">

    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-600 mb-4">
        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 11c0-1.657-1.343-3-3-3S6 9.343 6 11v2h6v-2zm-1.5 8h-3a2 2 0 01-2-2v-4h7v4a2 2 0 01-2 2zM18 13v-2a6 6 0 10-12 0v2" />
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-white tracking-tight">Forgot Password</h1>
      <p class="text-gray-400 mt-1 text-sm">Enter your email to receive an OTP</p>
    </div>

    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8 shadow-2xl">

      <h2 class="text-xl font-semibold text-white mb-6">Request OTP</h2>

      <div *ngIf="errorMessage"
        class="mb-4 px-4 py-3 bg-red-500/10 border border-red-500/20 rounded-xl text-red-400 text-sm flex items-center gap-2">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        {{ errorMessage }}
      </div>

      <div *ngIf="successMessage"
        class="mb-4 px-4 py-3 bg-green-500/10 border border-green-500/20 rounded-xl text-green-400 text-sm flex items-center gap-2">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        {{ successMessage }}
      </div>

      <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="space-y-5">

        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1.5">Email Address</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
              </svg>
            </div>
            <input
              formControlName="email"
              type="email"
              placeholder="you@example.com"
              class="w-full pl-10 pr-4 py-3 bg-gray-800 border rounded-xl text-white placeholder-gray-500 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all"
              [class.border-red-500]="email.invalid && email.touched"
              [class.border-gray-700]="!(email.invalid && email.touched)"
            />
          </div>
          <p *ngIf="email.invalid && email.touched" class="mt-1.5 text-xs text-red-400">
            <span *ngIf="email.errors?.['required']">Email is required</span>
            <span *ngIf="email.errors?.['email']">Enter a valid email address</span>
          </p>
        </div>

        <button
          type="submit"
          [disabled]="loading"
          class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold rounded-xl text-sm transition-all duration-200 flex items-center justify-center gap-2 mt-2">
          <svg *ngIf="loading" class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
            </path>
          </svg>
          {{ loading ? 'Sending...' : 'Send OTP' }}
        </button>
      </form>

      <div class="text-center mt-4">
        <a routerLink="/login" class="text-gray-500 hover:text-gray-300 text-xs transition-colors">
          ← Back to Login
        </a>
      </div>

    </div>

  </div>
</div>
