<div class="min-h-screen bg-gray-950 flex items-center justify-center px-4">

  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-indigo-600 opacity-10 rounded-full blur-3xl"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-violet-600 opacity-10 rounded-full blur-3xl"></div>
  </div>

  <div class="relative w-full max-w-md">

    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-600 mb-4">
        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-white tracking-tight">Verify OTP</h1>
      <p class="text-gray-400 mt-1 text-sm">We sent a 6-digit OTP to</p>
      <p class="text-indigo-400 font-medium text-sm mt-0.5">{{ email }}</p>
    </div>

    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8 shadow-2xl">

      <h2 class="text-xl font-semibold text-white mb-2">Enter OTP</h2>
      <p class="text-gray-400 text-sm mb-6">Enter the 6-digit code sent to your email</p>

      <div *ngIf="errorMessage"
        class="mb-4 px-4 py-3 bg-red-500/10 border border-red-500/20 rounded-xl text-red-400 text-sm flex items-center gap-2">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        {{ errorMessage }}
      </div>

      <div *ngIf="successMessage"
        class="mb-4 px-4 py-3 bg-green-500/10 border border-green-500/20 rounded-xl text-green-400 text-sm flex items-center gap-2">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        {{ successMessage }}
      </div>

      <div class="flex gap-3 justify-center mb-6" (paste)="onPaste($event)">
        <input
          *ngFor="let digit of [0,1,2,3,4,5]; let i = index"
          [id]="'otp-' + i"
          type="text"
          #otpInput
          inputmode="numeric"
          maxlength="1"
          [value]="otp[i]"
          (input)="onOtpInput($event, i)"
          (keydown)="onKeyDown($event, i)"
          class="w-12 h-14 text-center text-xl font-bold bg-gray-800 border-2 rounded-xl text-white focus:outline-none focus:border-indigo-500 transition-all caret-transparent"
          [class.border-indigo-500]="otp[i] !== ''"
          [class.border-gray-700]="otp[i] === ''"
          [class.border-red-500]="errorMessage && otp[i] === ''"
        />
      </div>

      <div class="text-center mb-6">
        <p *ngIf="!canResend" class="text-gray-500 text-sm">
          OTP expires in
          <span class="text-indigo-400 font-medium">{{ countdown }}s</span>
        </p>
        <p *ngIf="canResend" class="text-gray-500 text-sm">
          Didn't receive the OTP?
        </p>
      </div>

      <button
        (click)="onSubmit()"
        [disabled]="!isOtpComplete || loading"
        class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold rounded-xl text-sm transition-all duration-200 flex items-center justify-center gap-2">
        <svg *ngIf="loading" class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
          </path>
        </svg>
        {{ loading ? 'Verifying...' : 'Verify OTP' }}
      </button>

      <button
        (click)="resendOtp()"
        [disabled]="!canResend || resendLoading"
        class="w-full mt-3 py-3 px-4 border border-gray-700 hover:border-indigo-500 disabled:opacity-40 disabled:cursor-not-allowed text-gray-300 hover:text-white font-medium rounded-xl text-sm transition-all duration-200 flex items-center justify-center gap-2">
        <svg *ngIf="resendLoading" class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
          </path>
        </svg>
        {{ resendLoading ? 'Resending...' : 'Resend OTP' }}
      </button>

      <div class="text-center mt-4">
        <a routerLink="/forgot-password" class="text-gray-500 hover:text-gray-300 text-xs transition-colors">
          ← Back to Forgot Password
        </a>
      </div>

    </div>

  </div>
</div>
