<section class="min-h-screen bg-gray-950 text-white px-4 py-10">
	<div class="absolute inset-0 overflow-hidden pointer-events-none">
		<div class="absolute top-0 left-1/3 w-96 h-96 bg-indigo-600 opacity-10 rounded-full blur-3xl"></div>
		<div class="absolute bottom-0 right-1/4 w-96 h-96 bg-violet-600 opacity-10 rounded-full blur-3xl"></div>
	</div>

	<div class="relative max-w-3xl mx-auto">
		<header class="text-center mb-8">
			<p class="text-xs uppercase tracking-[0.3em] text-gray-500">Quiz result</p>
			<h1 class="text-3xl font-bold tracking-tight mt-2">Your score</h1>
			<p class="text-gray-400 mt-2">See if you passed and what happens next.</p>
		</header>

		<main class="bg-gray-900 border border-gray-800 rounded-2xl p-8 shadow-2xl text-center">
			<div class="flex flex-col items-center gap-3">
				<div
					class="w-28 h-28 rounded-full border-4 flex items-center justify-center text-3xl font-semibold"
					[ngClass]="passed ? 'border-emerald-500 text-emerald-300' : 'border-rose-500 text-rose-300'">
					{{ percent }}%
				</div>
				<p class="text-sm text-gray-400">{{ score }} / {{ total }} correct</p>
			</div>

			<div
				class="mt-6 px-4 py-3 rounded-xl border"
				[ngClass]="passed ? 'bg-emerald-500/10 border-emerald-500/20 text-emerald-300' : 'bg-rose-500/10 border-rose-500/20 text-rose-300'">
				<span *ngIf="passed">Passed! Great job on this quiz.</span>
				<span *ngIf="!passed">Not passed yet. Try again to improve your score.</span>
			</div>

			<div *ngIf="passed" class="mt-5 px-4 py-3 rounded-xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-300 text-sm">
				Your certificate will be sent to your registered email.
			</div>

			<div class="mt-8 flex flex-wrap justify-center gap-3">
				<a
					routerLink="/quizzes"
					class="px-5 py-2.5 rounded-xl border border-gray-800 text-sm text-gray-300 hover:border-indigo-500 transition-colors">
					Back to categories
				</a>
				<a
					routerLink="/quizzes/1"
					class="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-sm font-semibold transition-colors">
					Try again
				</a>
			</div>
		</main>
	</div>
</section>
