<section class="min-h-screen bg-gray-950 text-white px-4 py-10">
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-0 left-1/3 w-96 h-96 bg-indigo-600 opacity-10 rounded-full blur-3xl"></div>
        <div class="absolute bottom-0 right-1/4 w-96 h-96 bg-violet-600 opacity-10 rounded-full blur-3xl"></div>
    </div>

    <div class="relative max-w-4xl mx-auto">
        <header class="flex flex-col md:flex-row md:items-center md:justify-between gap-6 mb-8">
            <div>
                <p class="text-xs uppercase tracking-[0.3em] text-gray-500">Quiz in progress</p>
                <h1 class="text-3xl font-bold tracking-tight mt-2">{{ quizTitle }}</h1>
                <p class="text-gray-400 mt-2">Question {{ currentQuestionIndex + 1 }} of {{ totalQuestions }}</p>
            </div>
            <div class="flex items-center gap-4">
                <div class="px-4 py-2 rounded-xl border border-gray-800 text-sm text-gray-300">
                    Time left: <span class="text-indigo-400 font-semibold">{{ formattedTime }}</span>
                </div>
                <div class="px-4 py-2 rounded-xl border border-gray-800 text-sm text-gray-400">Auto-submit on timeout
                </div>
            </div>
        </header>

        <main class="bg-gray-900 border border-gray-800 rounded-2xl p-6 md:p-8 shadow-2xl">
            <h2 class="text-xl font-semibold leading-relaxed">{{ currentQuestion.text }}</h2>

            <div class="mt-6 grid gap-3">
                <button *ngFor="let option of currentQuestion.options" (click)="selectOption(option)"
                    [disabled]="isSubmitted"
                    [ngClass]="currentSelection === option ? 'border-indigo-500 bg-indigo-500/10 text-white' : 'border-gray-800 text-gray-300'"
                    class="w-full text-left px-4 py-3 rounded-xl border bg-gray-950 hover:border-indigo-500 transition-colors">
                    {{ option }}
                </button>
            </div>

            <div class="mt-8 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                <p class="text-xs text-gray-500">Randomized questions are pulled from the database each time.</p>
                <div class="flex flex-wrap gap-3">
                    <button *ngIf="currentQuestionIndex > 0"
                        class="px-5 py-2.5 rounded-xl border border-gray-800 text-sm text-gray-300 hover:border-indigo-500 transition-colors"
                        (click)="prevQuestion()" [disabled]="isSubmitted || currentQuestionIndex === 0">
                        Prev
                    </button>
                    <button *ngIf="currentQuestionIndex < totalQuestions - 1"
                        class="px-5 py-2.5 rounded-xl border border-gray-800 text-sm text-gray-300 hover:border-indigo-500 transition-colors"
                        (click)="nextQuestion()"
                        [disabled]="isSubmitted || currentQuestionIndex === totalQuestions - 1">
                        Next
                    </button>
                    <button
                        class="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-sm font-semibold transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                        [disabled]="isSubmitted || !allAnswered" (click)="submitQuiz()">
                        {{ isSubmitted ? 'Submitted' : 'Submit quiz' }}
                    </button>
                </div>
            </div>

            <div *ngIf="isSubmitted"
                class="mt-6 px-4 py-3 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-300 text-sm">
                Answer submitted successfully!
            </div>
        </main>
    </div>
</section>
